
# Tiers that can be applied to items, fallback to default-stats.item-tier
tiers:
  TRASH:
    display: "Trash"
    color: "<#505455>"
  COMMON:
    display: "Common"
    color: "<#b2bdbe>"
  UNCOMMON:
    display: "Uncommon"
    color: "<#67b467>"
  RARE:
    display: "Rare"
    color: "<#6386bb>"
  EPIC:
    display: "Epic"
    color: "<#804b96>"
  LEGENDARY:
    display: "Legendary"
    color: "<#cc9f4c>"
  MYTHICAL:
    display: "Mythical"
    color: "<#9c527b>"
  GODLY:
    display: "Godly"
    color: "<#a85151>"


# Registered item types list
# Will generate a .yml file under items/ folder
types:
  BLADE:
    display: "Blade"
  BOW:
    display: "Bow"
  STAFF:
    display: "Staff"
  ARMOR:
    display: "Armor"
  MATERIAL:
    display: "Material"


# Default stats for all items
default-stats:
  # Its possible to also assign normal stats here, but is not recommended
  # attack-damage: 1
  # attack-speed: 4
  item-tier: TRASH
  unbreakable: true
  custom-behavior:
    interaction: false # Cannot hit and interact normally/using vanilla behavior
    swing-speed: true # Each swing follows attack-speed, spam clicking will not register
